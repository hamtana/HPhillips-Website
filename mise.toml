# mise.toml
[tools]
node = "24"
pnpm = "10"

[env]
_.path = ["./node_modules/.bin"]
# Likely needed for Resend/Nodemailer secrets; remove if you don't use a .env
_.file = { path = ".env", redact = true }

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.dev]
description = "Vite dev server on :3000"
depends = ["install"]
run = "pnpm dev"

[tasks.routes]
description = "Regenerate TanStack Router route tree"
run = "pnpm generate-routes"

[tasks.build]
description = "Production build"
run = "pnpm build"

[tasks.preview]
description = "Preview the production build"
depends = ["build"]
run = "pnpm preview"

[tasks.typecheck]
description = "Type-check with tsc"
run = "pnpm exec tsc --noEmit"

[tasks.check]
description = "Typecheck, then build"
depends = ["typecheck", "build"]
